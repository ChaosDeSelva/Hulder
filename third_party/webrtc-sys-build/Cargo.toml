[package]
name = "webrtc-sys-build"
version = "0.3.13"
edition = "2021"
license = "Apache-2.0"
description = "Build utilities when working with libwebrtc"
repository = "https://github.com/zed-industries/livekit-rust-sdks"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "blocking"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
regex = "1.0"
scratch = "1.0"
fs2 = "0.4"
semver = "1.0"
anyhow = "1"
